name: play4fun

# Mọi cổng chỉ bind vào 127.0.0.1 — internet đi vào qua nginx native trên host.
#   127.0.0.1:${WEB_PORT}      -> web (Next.js)
#   127.0.0.1:${REALTIME_PORT} -> realtime (Socket.IO, path /socket.io/)
#   127.0.0.1:${POSTGRES_PORT} -> postgres (chỉ để quản trị qua SSH tunnel)

x-db-url: &db-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache + bảng xếp hạng (sorted set) + rate limit. Valkey = bản fork mã nguồn mở của Redis.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    # Chỉ trên localhost (quản trị / dev); realtime dùng nó để giữ phòng chơi qua mỗi lần deploy
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chạy 1 lần mỗi lần `up`, áp migration rồi thoát; web chỉ start khi migrate thành công.
  migrate:
    build:
      context: .
      target: migrate
    image: play4fun-migrate:latest
    restart: "no"
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    image: play4fun-web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://valkey:6379
      PUBLIC_URL: ${PUBLIC_URL}
      # Đăng nhập (không bắt buộc với người chơi). Thiếu khóa nhà cung cấp nào thì nút đó tự ẩn.
      BETTER_AUTH_URL: ${PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      # Thống kê + trang /admin (xem mục "Thống kê & trang admin" trong README)
      UMAMI_INTERNAL_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # /admin đọc số liệu trực tiếp từ database của Umami (chỉ SELECT)
      UMAMI_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REALTIME_INTERNAL_URL: http://realtime:3001
      # Quảng cáo Google AdSense (để trống = tắt)
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT_HOME: ${ADSENSE_SLOT_HOME:-}
      ADSENSE_SLOT_SIDEBAR: ${ADSENSE_SLOT_SIDEBAR:-}
      HOSTNAME: 0.0.0.0
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  realtime:
    build:
      context: .
      target: realtime
    image: play4fun-realtime:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://valkey:6379
      CORS_ORIGINS: ${PUBLIC_URL}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${REALTIME_PORT:-3001}:3001"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Thống kê truy cập (Umami, mã nguồn mở, không cookie) ---
  # Tạo database "umami" trong Postgres sẵn có nếu chưa có (chạy 1 lần mỗi lần `up`, idempotent)
  umami-db-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - >-
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1
        || psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "CREATE DATABASE umami"
    depends_on:
      postgres:
        condition: service_healthy

  # Dashboard chỉ mở trên 127.0.0.1 (xem qua SSH tunnel). Người chơi gửi dữ liệu qua
  # https://play4fun.io.vn/stats/* — web container chuyển tiếp vào đây (apps/web/app/stats).
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      # Ký phiên đăng nhập dashboard. Chưa đặt UMAMI_APP_SECRET thì dùng tạm mật khẩu Postgres (vẫn là bí mật)
      APP_SECRET: ${UMAMI_APP_SECRET:-${POSTGRES_PASSWORD}}
      DISABLE_TELEMETRY: 1
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3002}:3000"
    depends_on:
      umami-db-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  valkeydata:
