# /etc/nginx/conf.d/analytics.play4fun.io.vn.conf
# Umami dashboard at https://analytics.play4fun.io.vn (container "umami" bound to 127.0.0.1:3002).
#
# Install AFTER the certificate exists, otherwise "nginx -t" fails on the missing files:
#   1. DNS: A record  analytics.play4fun.io.vn -> server IP
#   2. sudo certbot certonly --webroot -w /var/www/certbot -d analytics.play4fun.io.vn
#   3. sudo cp deploy/nginx/analytics.play4fun.io.vn.conf /etc/nginx/conf.d/
#      sudo nginx -t && sudo systemctl reload nginx
# (The HTTP block that serves the certbot challenge is in play4fun.io.vn.conf.)
#
# Why a subdomain and not play4fun.io.vn/umami: the prebuilt Umami image only runs at the root of
# a domain (a sub-path needs BASE_PATH at image build time), and /stats on the main site is
# already the tracking proxy.

# Brute-force protection for the login form (Umami's own login is the main lock)
limit_req_zone $binary_remote_addr zone=p4f_umami_login:10m rate=5r/m;

upstream play4fun_umami {
    server 127.0.0.1:3002;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: xoá dòng này và dùng "listen 443 ssl http2;"
    server_name analytics.play4fun.io.vn;

    ssl_certificate     /etc/letsencrypt/live/analytics.play4fun.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.play4fun.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:play4fun_umami_ssl:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # A private dashboard: keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Optional second lock in front of Umami (recommended): a browser password prompt before the
    # dashboard even loads. Create the file once, then uncomment the two lines:
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-umami <ten-dang-nhap>
    # auth_basic "Play4Fun analytics";
    # auth_basic_user_file /etc/nginx/.htpasswd-umami;

    # Optional: only allow your own IP(s) (fixed office / home IP)
    # allow 1.2.3.4;
    # deny all;

    location ~ /\.(?!well-known/) {
        access_log off;
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=p4f_umami_login burst=5 nodelay;
        proxy_pass http://play4fun_umami;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://play4fun_umami;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
