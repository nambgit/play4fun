# /etc/nginx/conf.d/play4fun.io.vn.conf   (hoặc sites-available + symlink sites-enabled)
# Nginx chạy native trên host, forward vào các container bind ở 127.0.0.1.
# Chứng chỉ SSL: certbot (Let's Encrypt), xem deploy/README trong README.md gốc.

upstream play4fun_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream play4fun_realtime {
    server 127.0.0.1:3001;
}

# --- Rate limits (per client IP) ---
# API (record sync, leaderboards, runs, auth session checks): generous for real use, stops floods
limit_req_zone $binary_remote_addr zone=p4f_api:10m rate=10r/s;
# Sign-in / sign-up / OAuth callbacks
limit_req_zone $binary_remote_addr zone=p4f_auth:10m rate=2r/s;
# Generated share images (/og/*): rendering costs CPU
limit_req_zone $binary_remote_addr zone=p4f_og:10m rate=2r/s;
# Open realtime connections per IP. High on purpose: a whole office playing team building
# can sit behind one IP (the realtime server also caps rooms per IP).
limit_conn_zone $binary_remote_addr zone=p4f_conn:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $play4fun_connection_upgrade {
    default upgrade;
    ''      close;
}

# Chặn mọi request không đúng domain (truy cập thẳng bằng IP, Host lạ).
# Bot quét lỗ hổng thường quét theo dải IP; không có block này, nginx dùng
# server port 80 đầu tiên làm mặc định và redirect bot sang domain thật.
# 444 = đóng kết nối, không trả response. Cần nginx >= 1.19.4 (ssl_reject_handshake).
# Nếu "nginx -t" báo "duplicate default server": xoá /etc/nginx/sites-enabled/default.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;   # từ chối TLS khi SNI không khớp, không lộ chứng chỉ
    access_log off;            # không ghi rác của bot vào log

    return 444;
}

# HTTP -> HTTPS (giữ đường dẫn cho certbot webroot)
server {
    listen 80;
    listen [::]:80;
    server_name play4fun.io.vn www.play4fun.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://play4fun.io.vn$request_uri;
    }
}

# Umami dashboard: HTTP -> HTTPS. Only the certbot challenge is served over plain HTTP, so the
# certificate can be issued before analytics.play4fun.io.vn.conf (the HTTPS part) is installed.
server {
    listen 80;
    listen [::]:80;
    server_name analytics.play4fun.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://analytics.play4fun.io.vn$request_uri;
    }
}

# www -> non-www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: xoá dòng này và dùng "listen 443 ssl http2;"
    server_name www.play4fun.io.vn;

    ssl_certificate     /etc/letsencrypt/live/play4fun.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play4fun.io.vn/privkey.pem;

    return 301 https://play4fun.io.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play4fun.io.vn;

    ssl_certificate     /etc/letsencrypt/live/play4fun.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play4fun.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:play4fun_ssl:10m;
    ssl_session_timeout 1d;

    # Security headers. NOTE: a location that declares its own add_header does NOT inherit these,
    # so /_next/static/ repeats them below.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # Clickjacking / base-tag / plugin protection. Not a script-src policy on purpose: AdSense and
    # Next.js inline scripts would need a nonce-based setup to work under one.
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Lưu ý: proxy_set_header ở cấp location KHÔNG kế thừa từ cấp server,
    # nên mỗi location tự khai báo đủ header.

    # --- Chặn dotfile (.env, .git, .htaccess...) trừ .well-known ---
    # Regex location được ưu tiên hơn prefix "/" nên chặn được trước khi tới app.
    location ~ /\.(?!well-known/) {
        access_log off;
        return 404;
    }

    # --- Realtime (Socket.IO, WebSocket) ---
    location /socket.io/ {
        limit_conn p4f_conn 100;
        proxy_pass http://play4fun_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $play4fun_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # --- Asset tĩnh của Next.js (tên file có hash, cache lâu dài) ---
    location /_next/static/ {
        proxy_pass http://play4fun_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Rate-limited parts of the web app (same proxy settings as "/") ---
    location /api/auth/ {
        limit_req zone=p4f_auth burst=20 nodelay;
        proxy_pass http://play4fun_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=p4f_api burst=40 nodelay;
        proxy_pass http://play4fun_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /og/ {
        limit_req zone=p4f_og burst=10 nodelay;
        proxy_pass http://play4fun_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Web ---
    location / {
        proxy_pass http://play4fun_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
